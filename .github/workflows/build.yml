name: Build

on:
  push:
    branches: [ next ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: audience-kit/apps/hot_mess/ios

jobs:
  build:
    runs-on: macos-latest
    steps:
      # HotMess.xcodeproj resolves the AudienceKit Swift package from sdk/audiencekit-swift in
      # audience-kit three levels up (`../../../sdk/audiencekit-swift`), where this repository is the
      # apps/hot_mess/ios submodule. Lay the runner out the same way: audience-kit (private,
      # read with AUDIENCE_KIT_DEPLOY_KEY, a read-only deploy key, or AUDIENCE_KIT_TOKEN) at the
      # root and this checkout under it.
      - name: Check out audience-kit
        uses: actions/checkout@v5
        with:
          repository: audience-kit/audience-kit
          ref: next
          path: audience-kit
          sparse-checkout: sdk/audiencekit-swift
          ssh-key: ${{ secrets.AUDIENCE_KIT_DEPLOY_KEY }}
          token: ${{ secrets.AUDIENCE_KIT_TOKEN || github.token }}

      # A change that spans both repositories uses the same branch name in each: build against
      # audience-kit's copy of this branch when there is one, so the pair builds before either merges.
      - name: Use audience-kit's matching branch
        working-directory: audience-kit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git fetch --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            git checkout --detach FETCH_HEAD
            echo "Building against audience-kit $BRANCH"
          else
            echo "No audience-kit branch $BRANCH; building against next"
          fi

      - uses: actions/checkout@v5
        with:
          path: audience-kit/apps/hot_mess/ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project HotMess.xcodeproj \
            -scheme "HotMess Debug" \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -scmProvider system \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build.log

      - name: Show why the build failed
        if: failure()
        run: |
          # Compiler crashes and some failures print no "error:" line, so the
          # filtered output above can show nothing but BUILD FAILED.
          grep -n -A40 "The following build commands failed" build.log || true
          grep -n -B2 -A25 "Stack dump\|nonzero exit code\|error:" build.log | tail -200 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: audience-kit/apps/hot_mess/ios/build.log
